<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Login - Campus Recruitment System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/campuss/css/modern-design.css">
    <style>
        /* Login Page Specific Styles */
        .login-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr;
            place-items: center;
            padding: var(--spacing-md);
            background: var(--gradient-bg);
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .login-page::before,
        .login-page::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }

        .login-page::before {
            background: rgba(125, 29, 127, 0.3);
            top: -100px;
            left: -100px;
            animation: float 15s ease-in-out infinite;
        }

        .login-page::after {
            background: rgba(0, 128, 255, 0.2);
            bottom: -100px;
            right: -100px;
            animation: float 20s ease-in-out infinite reverse;
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            animation: float 10s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(125, 29, 127, 0.2);
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(0, 212, 255, 0.15);
            bottom: 15%;
            right: 15%;
            animation-delay: 3s;
        }

        /* Login Container */
        .login-wrapper {
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: var(--blur-lg);
            border: 1px solid rgba(125, 29, 127, 0.2);
            border-radius: 2rem;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: var(--gradient-primary);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(125, 29, 127, 0.3);
        }

        .login-header h1 {
            font-size: var(--font-size-2xl);
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff, var(--primary-300));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: var(--text-tertiary);
            font-size: var(--font-size-sm);
        }

        /* Form Elements */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            margin: 0;
        }

        .form-control {
            padding: 1rem 1.25rem;
            font-size: var(--font-size-base);
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(125, 29, 127, 0.2);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-500);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(125, 29, 127, 0.1), 0 0 20px rgba(125, 29, 127, 0.2);
        }

        .password-toggle {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: var(--primary-500);
        }

        .form-password-wrapper {
            position: relative;
        }

        /* Remember Me & Forgot Password */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--font-size-sm);
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .form-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-500);
        }

        .form-checkbox label {
            cursor: pointer;
            margin-bottom: 0;
        }

        .forgot-password {
            color: var(--primary-400);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--accent-cyan);
        }

        /* Login Button */
        .login-btn {
            padding: 1.125rem;
            font-size: var(--font-size-base);
            font-weight: 700;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(125, 29, 127, 0.3);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 45px rgba(125, 29, 127, 0.4);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Divider */
        .form-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            gap: 1rem;
            color: var(--text-tertiary);
            font-size: var(--font-size-sm);
        }

        .form-divider::before,
        .form-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        /* Social Login (Optional) */
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            padding: 0.875rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: var(--font-size-sm);
            font-weight: 600;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-500);
        }

        /* Login Footer */
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }

        .login-footer a {
            color: var(--primary-400);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--accent-cyan);
        }

        /* Alert Messages */
        .alert {
            padding: 1rem;
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            font-size: var(--font-size-sm);
            animation: slideUp 0.4s ease-out;
        }

        .alert-danger {
            background: rgba(255, 0, 110, 0.2);
            border: 1px solid rgba(255, 0, 110, 0.3);
            color: rgba(255, 0, 110, 0.9);
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: rgba(0, 255, 136, 0.9);
        }

        /* Loading State */
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: rotate 1s linear infinite;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .login-card {
                padding: 2rem;
            }

            .login-header h1 {
                font-size: var(--font-size-xl);
            }

            .login-icon {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }

            .floating-orb {
                display: none;
            }
        }

        /* Link button style */
        .link-btn {
            background: none;
            border: none;
            color: var(--primary-400);
            cursor: pointer;
            text-decoration: underline;
            font-size: var(--font-size-sm);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>

        <div class="login-wrapper">
            <div class="login-card">
                <!-- Login Header -->
                <div class="login-header">
                    <div class="login-icon">◆</div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your Campus Portal</p>
                </div>

                <!-- Alerts (shown conditionally by PHP) -->
                <div id="error-alert" class="alert alert-danger" style="display: none;"></div>
                <div id="success-alert" class="alert alert-success" style="display: none;"></div>

                <!-- Login Form -->
                <form class="login-form" method="POST" id="login-form">
                    <!-- Email Input -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email"
                            name="email" 
                            class="form-control" 
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="form-password-wrapper">
                            <input 
                                type="password" 
                                id="password"
                                name="password" 
                                class="form-control" 
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                            >
                            <button 
                                type="button" 
                                class="password-toggle" 
                                onclick="togglePasswordVisibility()"
                                aria-label="Toggle password visibility"
                            >
                                ◉
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-options">
                        <label class="form-checkbox">
                            <input type="checkbox" name="remember" aria-label="Remember me">
                            <span>Remember me</span>
                        </label>
                        <a href="#forgot-password" class="forgot-password">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        <span id="btn-text">Sign In</span>
                        <span id="btn-spinner" class="loading-spinner" style="display: none;"></span>
                    </button>
                </form>

                <!-- Social Login (Optional) -->
                <!-- 
                <div class="form-divider">or continue with</div>
                <div class="social-login">
                    <button type="button" class="social-btn">Google</button>
                    <button type="button" class="social-btn">Microsoft</button>
                </div>
                -->

                <!-- Footer -->
                <div class="login-footer">
                    Don't have an account? 
                    <a href="/campuss/register.php">Create one now →</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/campuss/js/theme-manager.js"></script>
    <script src="/campuss/js/animations.js"></script>
    
    <script>
        // Password visibility toggle
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.password-toggle');
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '◎';
            } else {
                input.type = 'password';
                btn.textContent = '◉';
            }
        }

        // Form submission handler
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            
            btnText.style.display = 'none';
            spinner.style.display = 'block';
        });

        // Show error message if present
        const errorMsg = new URLSearchParams(window.location.search).get('error');
        if (errorMsg) {
            const alertEl = document.getElementById('error-alert');
            alertEl.textContent = decodeURIComponent(errorMsg);
            alertEl.style.display = 'block';
            
            // Shake animation
            setTimeout(() => {
                shakeElement(document.querySelector('.login-card'));
            }, 100);
        }

        // Show success message if present
        const successMsg = new URLSearchParams(window.location.search).get('success');
        if (successMsg) {
            const alertEl = document.getElementById('success-alert');
            alertEl.textContent = decodeURIComponent(successMsg);
            alertEl.style.display = 'block';
        }
    </script>
</body>
</html>
