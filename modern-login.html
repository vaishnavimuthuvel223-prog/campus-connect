<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Recruitment - Login</title>
    <link rel="stylesheet" href="css/modern-design.css">
</head>
<body class="login-page">
    <!-- Animated Background -->
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="gradient-overlay"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <div class="login-container">
        <!-- Left Side - Abstract Design -->
        <div class="login-left">
            <div class="abstract-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
            </div>
            <div class="left-content">
                <h1 class="brand-title">Campus Connect</h1>
                <p class="brand-subtitle">Premium Recruitment Management</p>
                <div class="feature-list">
                    <div class="feature-item">
                        <span class="feature-icon">✔</span>
                        <span class="feature-text">Next-Gen Hiring Platform</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">✔</span>
                        <span class="feature-text">Real-Time Analytics</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">✔</span>
                        <span class="feature-text">Seamless Integration</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Login Card -->
        <div class="login-right">
            <div class="login-card">
                <!-- Bright Theme Only - No Theme Toggle -->

                <div class="login-header">
                    <h2 class="login-title">Welcome Back</h2>
                    <p class="login-subtitle">Sign in to your account to continue</p>
                </div>

                <form class="login-form" id="loginForm">
                    <!-- Role Selection -->
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="student" checked>
                            <span class="role-label">Student</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="staff">
                            <span class="role-label">Staff</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="admin">
                            <span class="role-label">Admin</span>
                        </label>
                    </div>

                    <!-- Email Input -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input 
                                type="email" 
                                class="form-input" 
                                id="email" 
                                placeholder="Enter your email"
                                required
                            >
                            <label class="floating-label" for="email">Email Address</label>
                            <span class="input-glow"></span>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                class="form-input" 
                                id="password" 
                                placeholder="Enter your password"
                                required
                            >
                            <label class="floating-label" for="password">Password</label>
                            <span class="input-glow"></span>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="login-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-ripple"></span>
                    </button>

                    <!-- Sign Up Link -->
                    <p class="signup-link">
                        Don't have an account? <a href="#">Create one</a>
                    </p>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>or continue with</span>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button class="social-btn" aria-label="Login with Google">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                    </button>
                    <button class="social-btn" aria-label="Login with Microsoft">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zm12.6 0H12.6V0H24v11.4z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/theme-manager.js"></script>
    <script src="js/login-animations.js"></script>
    
    <script>
        // Initialize bright theme and animations on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize theme manager (bright theme only)
            const themeManager = new ThemeManager();
            
            // Initialize login animations
            const loginAnimations = new LoginAnimations();
            
            console.log('✓ Bright theme activated');
            console.log('✓ Login animations enabled');
        });
    </script>
</body>
</html>
